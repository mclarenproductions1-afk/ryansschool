<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>This is a free website</title>
<style>
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

  html, body {
    margin: 0;
    height: 100%;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.15), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255, 80, 200, 0.12), transparent 50%);
    animation: drift 12s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(2%, -2%) scale(1.05); }
  }

  h1 {
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: clamp(2rem, 8vw, 5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    text-align: center;
    padding: 0 1rem;
    background: linear-gradient(90deg,
      #ff6ec4, #7873f5, #4ade80, #facc15, #ff6ec4);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 6s linear infinite;
    position: relative;
    z-index: 1;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  h1::after {
    content: "this is a free website";
    position: absolute;
    inset: 0;
    background: inherit;
    background-size: inherit;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: blur(20px);
    opacity: 0.6;
    z-index: -1;
  }
</style>
</head>
<body>
  <h1>this is a free website</h1>
</body>
</html>
